<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <defs>
    <!-- Same line-icon shapes as AgentIconComponent (client/src/app/travel-booking/agent-icon/agent-icon.component.html),
         one symbol per vertical, colored to match its accent color (flights blue, stays purple, cars green). -->
    <symbol id="ic-flight" viewBox="0 0 24 24">
      <g fill="none" stroke="#0a84ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12h17"/>
        <path d="M13 12L7 4"/>
        <path d="M13 12L7 20"/>
        <path d="M6 12L2 9"/>
        <path d="M6 12L2 15"/>
      </g>
    </symbol>
    <symbol id="ic-stay" viewBox="0 0 24 24">
      <g fill="none" stroke="#a855f7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="11" width="20" height="6" rx="1.5"/>
        <path d="M4 11V8a2 2 0 0 1 2-2h3"/>
        <path d="M4 17v3"/>
        <path d="M20 17v3"/>
      </g>
    </symbol>
    <symbol id="ic-car" viewBox="0 0 24 24">
      <g fill="none" stroke="#22c55e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 13l1.5-5A2 2 0 0 1 6.4 6.5h11.2a2 2 0 0 1 1.9 1.5L21 13"/>
        <rect x="2" y="13" width="20" height="5" rx="1.5"/>
        <circle cx="7" cy="18.5" r="1.5"/>
        <circle cx="17" cy="18.5" r="1.5"/>
      </g>
    </symbol>
  </defs>

  <rect width="480" height="480" fill="#ffffff"/>

  <!-- Uniform 6-row x 5-column grid (30 cells, no drops) — the earlier 32-icon version
       ("wizard-icons-bg 6.svg") dropped 4 cells unevenly out of a 6x6 grid, so some rows
       ended up with 6 icons and others with 5, leaving extra gaps in the shorter rows.
       Using a grid whose dimensions divide evenly (5x6=30) means every row has exactly
       the same count — no row is left sparser than the others. Same tight jitter (16% of
       cell size), rotation range (+-28deg), and scale range (1.0-1.5) as that version. -->
  <g opacity="0.15">
    <!-- ic-flight -->
    <use href="#ic-flight" width="24" height="24" transform="translate(51.1,38.7) rotate(20) scale(1.33)"/>
    <use href="#ic-flight" width="24" height="24" transform="translate(343.5,35.1) rotate(-17) scale(1.25)"/>
    <use href="#ic-flight" width="24" height="24" transform="translate(136.8,108.8) rotate(-18) scale(1.39)"/>
    <use href="#ic-flight" width="24" height="24" transform="translate(417.8,108.5) rotate(3) scale(1.30)"/>
    <use href="#ic-flight" width="24" height="24" transform="translate(233.4,194.7) rotate(-24) scale(1.33)"/>
    <use href="#ic-flight" width="24" height="24" transform="translate(36.0,267.6) rotate(-8) scale(1.24)"/>
    <use href="#ic-flight" width="24" height="24" transform="translate(336.6,288.2) rotate(-21) scale(1.50)"/>
    <use href="#ic-flight" width="24" height="24" transform="translate(137.7,358.7) rotate(19) scale(1.35)"/>
    <use href="#ic-flight" width="24" height="24" transform="translate(440.8,370.4) rotate(-23) scale(1.24)"/>
    <use href="#ic-flight" width="24" height="24" transform="translate(229.7,444.0) rotate(-9) scale(1.10)"/>

    <!-- ic-stay -->
    <use href="#ic-stay" width="24" height="24" transform="translate(134.0,40.7) rotate(-13) scale(1.31)"/>
    <use href="#ic-stay" width="24" height="24" transform="translate(437.7,42.8) rotate(-28) scale(1.24)"/>
    <use href="#ic-stay" width="24" height="24" transform="translate(240.9,107.9) rotate(-18) scale(1.42)"/>
    <use href="#ic-stay" width="24" height="24" transform="translate(40.2,203.7) rotate(-16) scale(1.15)"/>
    <use href="#ic-stay" width="24" height="24" transform="translate(341.6,204.9) rotate(24) scale(1.04)"/>
    <use href="#ic-stay" width="24" height="24" transform="translate(147.4,290.2) rotate(-24) scale(1.36)"/>
    <use href="#ic-stay" width="24" height="24" transform="translate(433.9,290.7) rotate(-4) scale(1.29)"/>
    <use href="#ic-stay" width="24" height="24" transform="translate(255.2,370.0) rotate(-4) scale(1.27)"/>
    <use href="#ic-stay" width="24" height="24" transform="translate(57.9,430.5) rotate(26) scale(1.09)"/>
    <use href="#ic-stay" width="24" height="24" transform="translate(340.0,449.9) rotate(-10) scale(1.40)"/>

    <!-- ic-car -->
    <use href="#ic-car" width="24" height="24" transform="translate(251.2,39.3) rotate(-14) scale(1.44)"/>
    <use href="#ic-car" width="24" height="24" transform="translate(58.4,108.5) rotate(5) scale(1.02)"/>
    <use href="#ic-car" width="24" height="24" transform="translate(335.6,127.9) rotate(-10) scale(1.22)"/>
    <use href="#ic-car" width="24" height="24" transform="translate(151.3,209.2) rotate(0) scale(1.10)"/>
    <use href="#ic-car" width="24" height="24" transform="translate(445.6,198.2) rotate(25) scale(1.07)"/>
    <use href="#ic-car" width="24" height="24" transform="translate(253.4,274.3) rotate(12) scale(1.09)"/>
    <use href="#ic-car" width="24" height="24" transform="translate(43.0,362.5) rotate(-10) scale(1.36)"/>
    <use href="#ic-car" width="24" height="24" transform="translate(329.7,349.8) rotate(11) scale(1.16)"/>
    <use href="#ic-car" width="24" height="24" transform="translate(150.4,445.1) rotate(-16) scale(1.21)"/>
    <use href="#ic-car" width="24" height="24" transform="translate(428.7,430.6) rotate(20) scale(1.18)"/>
  </g>
</svg>
